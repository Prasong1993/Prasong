name: iris-step1 tests
on:
  push:
    paths:
      - "IRIS/iris-step1/**"
  pull_request:
    paths:
      - "IRIS/iris-step1/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IRIS/iris-step1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
